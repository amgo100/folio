# The fuzz targets of SPEC §14.2, for `cargo fuzz` (nightly Rust). A
# workspace of its own, so that libFuzzer stays out of the main one; the
# targets' bodies are in `folio-testkit` (`src/fuzz.rs`), where `cargo test`
# replays `regressions/` on stable. `scripts/fuzz.sh` runs them.
[package]
name = "folio-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
folio-testkit = { path = "../crates/folio-testkit" }
libfuzzer-sys = "0.4.13"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "markup"
path = "fuzz_targets/markup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stylesheet"
path = "fuzz_targets/stylesheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt"
path = "fuzz_targets/fmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reparse"
path = "fuzz_targets/reparse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "style"
path = "fuzz_targets/style.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nesting"
path = "fuzz_targets/nesting.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lockfile"
path = "fuzz_targets/lockfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tex"
path = "fuzz_targets/tex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

# The same patched crates as the main workspace (SPEC §2.4, D-300-1; see
# the root Cargo.toml), so that the fuzz targets build what Folio ships.
[patch.crates-io]
hayro-interpret = { path = "../third_party/hayro-interpret" }
hayro-jpeg2000 = { path = "../third_party/hayro-jpeg2000" }
hayro-syntax = { path = "../third_party/hayro-syntax" }
kurbo = { path = "../third_party/kurbo" }
moxcms = { path = "../third_party/moxcms" }
resvg = { path = "../third_party/resvg" }
svgtypes = { path = "../third_party/svgtypes" }
tiny-skia = { path = "../third_party/tiny-skia" }
tiny-skia-path = { path = "../third_party/tiny-skia-path" }
usvg = { path = "../third_party/usvg" }
