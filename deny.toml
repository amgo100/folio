# cargo-deny policy: `cargo deny check` (licences, advisories, bans, sources).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build, including unmaintained and unsound
# crates. Ignore one only with a reason and an issue that tracks its removal.
unmaintained = "all"
yanked = "deny"
ignore = [
    # D-47-1 = A: krilla-svg, which draws SVG images in PDF (SPEC §11.1),
    # turns on krilla's `simple-text` and usvg's `text` features, which pull
    # in these two crates. Folio never runs them: it shapes its own text and
    # gives SVG drawings no fonts. Drop both when krilla allows it: #294.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unused text path of krilla-svg (#294)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, unused text path of krilla-svg (#294)" },
]

[licenses]
# Permissive licences only. Folio forks Apache-2.0 code from Typst, and its
# fonts are under the SIL Open Font Licence (SPEC §2.5).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list anticipates the dependencies of SPEC §2.2; most are not in the tree yet.
unused-allowed-license = "allow"
# libFuzzer, which the fuzz targets in `fuzz/` link (a workspace of its own,
# checked by `scripts/check.sh` with this file), is under the permissive
# University of Illinois/NCSA licence. It is a test tool, never shipped.
# The main workspace does not have it, so cargo-deny warns there that the
# exception is unmatched; that warning is expected.
# `notify`, the file watcher of `folio watch` (SPEC §12.2), is dedicated to
# the public domain under CC0-1.0, which waives copyright but not patents.
# It alone may use that licence (decision D-50-1); any other CC0 crate
# needs a decision of its own.
exceptions = [
    { name = "libfuzzer-sys", allow = ["NCSA"] },
    { name = "notify", allow = ["CC0-1.0"] },
]

[licenses.private]
# Workspace crates are not published and have no licence field until the
# project licence is chosen (SPEC §16.1).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
