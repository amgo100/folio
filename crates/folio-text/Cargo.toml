ecow.workspace = true
harfrust.workspace = true
hypher.workspace = true
icu_segmenter.workspace = true
rayon.workspace = true
unicode-bidi.workspace = true
unicode-script.workspace = true

[dev-dependencies]
folio-fonts.workspace = true

[lints]
workspace = true
