[workspace]
resolver = "3"
members = ["crates/*"]
# The patched upstream crates (below) are dependencies, not members: they
# keep their own lints and tests.
exclude = ["third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version. Raise it only when a dependency needs it;
# `scripts/check.sh` checks the workspace with exactly this toolchain.
rust-version = "1.95"
repository = "https://github.com/amgo100/folio"
# Nothing is published until the name is cleared (SPEC §16.1).
publish = false

[workspace.dependencies]
folio-syntax = { path = "crates/folio-syntax" }
folio-component = { path = "crates/folio-component" }
folio-core = { path = "crates/folio-core" }
folio-fonts = { path = "crates/folio-fonts" }
folio-text = { path = "crates/folio-text" }
folio-math = { path = "crates/folio-math" }
folio-pdf = { path = "crates/folio-pdf" }
folio-render = { path = "crates/folio-render" }
folio-testkit = { path = "crates/folio-testkit" }
folio = { path = "crates/folio" }
folio-lsp = { path = "crates/folio-lsp" }
folio-preview = { path = "crates/folio-preview" }
# The command line (SPEC §12.1).
clap = { version = "4.6.10", features = ["derive"] }
codespan-reporting = "0.13.1"
# The language server's channels, shared with `lsp-server` (SPEC §12.3).
crossbeam-channel = "0.5.15"
ecow = "0.2.6"
# The preview's websocket streams (SPEC §12.2).
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
# The preview's session token (SPEC §14.3).
getrandom = "0.4.2"
# The preview's HTTP requests, parsed before a websocket takes the stream.
httparse = "1.10.1"
# Verifies the signatures of compiler releases (SPEC §14.3). No default
# features: verification needs neither key generation nor zeroising.
ed25519-dalek = { version = "3.0.0", default-features = false }
# System font discovery; `memmap` is off, so it reads files instead of
# mapping them (SPEC §2.3).
# Shaping (SPEC §2.2); it reads fonts through the same `read-fonts` as skrifa.
harfrust = "0.16.2"
# Instruction-count benchmarks under Callgrind (SPEC §14.1); the successor
# of `iai-callgrind`, renamed with 0.17. Benchmarks need the matching
# `gungraun-runner` and Valgrind.
gungraun = "0.20.0"
# Hyphenation patterns, every language.
hypher = "0.1.8"
# Line-break opportunities (UAX #14), with the models for scripts written
# without spaces.
icu_segmenter = "2.4.0"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
indexmap = "2.14.2"
# The scripting layer's `calc` functions: a portable maths library, so that
# they give the same bits on every platform (SPEC §2.4).
libm = "0.2.16"
# The language server (SPEC §12.3): the protocol's transport and types,
# synchronous, without an async runtime.
lsp-server = "0.10.0"
lsp-types = "0.97.0"
# PDF output (SPEC §11.1): tagging, PDF/UA, PDF/A and font subsetting.
# Without the default `simple-text`, as Folio shapes text itself.
# `raster-images` decodes PNG, WebP and GIF and passes JPEG through; `pdf`
# embeds PDF figures as form XObjects.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "pdf"] }
# SVG figures as vector paths in PDF (SPEC §11.1), through `usvg`.
krilla-svg = "0.8.1"
# Images (SPEC §7.2, §11.1): SVG parsed and simplified (the version
# krilla-svg uses), and drawn into page images; PDF figures read for their
# page size, and converted to SVG where PDF/UA forbids embedding them;
# the pixel size of raster images; and the decoders of the formats that
# `png` does not read, which check images and draw page images. All are
# the versions krilla uses. `roxmltree` finds text in SVG drawings.
usvg = "0.47.0"
roxmltree = "0.21.1"
resvg = { version = "0.47.0", default-features = false }
hayro-syntax = "0.7.2"
hayro-svg = { version = "0.7.0", default-features = false }
imagesize = "0.14.0"
zune-jpeg = "0.5.5"
image-webp = "0.2.1"
gif = "0.14.2"
# Maps files of the immutable font cache (SPEC §2.3, §14.2).
memmap2 = "0.9.12"
# File-system events for `folio watch` (SPEC §12.2).
notify = "9.0.0"
# Property tests (SPEC §14.2), without forking test processes.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
salsa = "0.28.6"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Font parsing (fontations): maintained, and shared with the shaper and PDF
# writer of SPEC §2.2.
skrifa = "0.50.0"
# Rasterisation of display lists (SPEC §12.2). No default features: `simd`
# is off so that every platform draws the same pixels from the same scalar
# float code (SPEC §2.4), and PNG goes through `png` directly.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
# PNG output of rendered pages and the page-image goldens (SPEC §14.2).
png = "0.18.1"
# Font files are locked by their SHA-256 hash (SPEC §2.4).
sha2 = "0.11.1"
# Grows the evaluator's stack on deep recursion (SPEC §14.3).
stacker = "0.1.25"
tempfile = "3.27.0"
# The span-preserving parser only: the manifest and lockfile readers report
# errors on keys and values themselves, so serde is not needed.
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "preserve_order"] }
# The preview server (SPEC §2.2): its runtime, and websockets over it
# without the client side's TLS.
tokio = { version = "1.48.0", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
unicode-bidi = "0.3.18"
unicode-ident = "1.0"
# The Unicode math class of a character, which spaces and stretches it in
# math layout (SPEC §8.2).
unicode-math-class = "0.1"
unicode-script = "0.5"

[workspace.lints.rust]
# SPEC §14.2. `folio-node` and font memory-mapping (`folio-fonts`) are the only
# exceptions; they declare their own `[lints]` table instead of inheriting
# this one.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

# The parser's exhaustive reparse tests run about ten times faster optimised.
[profile.test.package.folio-syntax]
opt-level = 2

[profile.release]
debug = "line-tables-only"

# Upstream crates whose floating-point code called the platform's maths
# library, patched to call `libm` (SPEC §2.4, D-300-1), so that SVG and PDF
# figures give the same PDF bytes on every platform. third_party/README.md
# says what each patch changes; scripts/patch-third-party.sh rebuilds the
# copies from the crates.io releases. fuzz/Cargo.toml has the same table.
[patch.crates-io]
hayro-interpret = { path = "third_party/hayro-interpret" }
hayro-syntax = { path = "third_party/hayro-syntax" }
kurbo = { path = "third_party/kurbo" }
resvg = { path = "third_party/resvg" }
svgtypes = { path = "third_party/svgtypes" }
tiny-skia = { path = "third_party/tiny-skia" }
tiny-skia-path = { path = "third_party/tiny-skia-path" }
usvg = { path = "third_party/usvg" }
