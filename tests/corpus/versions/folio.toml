[project]
entry = "main.fol"
edition = "2027"
compiler = "0.0.0"
lang = "en-GB"
styles = ["styles/paper.fsty"]
# SPEC §6.4: every variant is built once for each version, and each
# version's exam and mark scheme share their numbers.
versions = ["A", "B"]

[variants.exam]
targets = ["pdf"]

[variants.markscheme]
targets = ["pdf"]

[numbering-groups.paper]
variants = ["exam", "markscheme"]
shared-counters = ["heading", "figure"]
