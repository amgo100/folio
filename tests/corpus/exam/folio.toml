[project]
entry = "main.fol"
edition = "2027"
compiler = "0.0.0"
lang = "en-GB"
styles = ["styles/exam.fsty"]

# As in SPEC §6.1. DOCX has no writer yet: its build checks the document,
# warns, and writes nothing.
[variants.exam]
targets = ["pdf", "docx"]

[variants.markscheme]
targets = ["pdf"]
styles = ["styles/markscheme.fsty"]
