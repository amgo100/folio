<?xml version="1.0" encoding="UTF-8"?>
<!-- A block on a 5-12-13 ramp with the forces on it. It holds what makes
     SVG output depend on platform maths (SPEC §2.4): a blurred drop shadow
     (a filter), rotate and skewX transforms, arcs, and arrowheads that
     markers orient along their lines. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="3" dy="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <path d="M 30 180 L 270 180 L 30 80 Z" fill="#e8e8e8" stroke="#000000" stroke-width="1.5"/>
  <path d="M 210 180 A 60 60 0 0 1 214.6 157" fill="none" stroke="#000000"/>
  <g transform="translate(150 130) rotate(22.619865)" filter="url(#shadow)">
    <rect x="-26" y="-32" width="52" height="32" fill="#f0d070" stroke="#000000" stroke-width="1.5"/>
  </g>
  <path d="M 156 115 l 48 20" fill="none" stroke="#c02020" stroke-width="2" marker-end="url(#head)"/>
  <path d="M 156 115 l 0 56" fill="none" stroke="#2040c0" stroke-width="2" marker-end="url(#head)"/>
  <path d="M 156 115 l 20 -48" fill="none" stroke="#208020" stroke-width="2" marker-end="url(#head)"/>
  <g transform="translate(200 24) skewX(-15)">
    <rect x="0" y="0" width="64" height="22" fill="#ffffff" stroke="#000000"/>
    <circle cx="14" cy="11" r="5" fill="#c02020"/>
    <path d="M 26 11 H 56" stroke="#000000" stroke-width="1.5" marker-end="url(#head)"/>
  </g>
</svg>
